name: Ubuntu CUDA 13 Build Publish
'on':
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Upstream Commit SHA'
        required: false
        default: 'manual-build'
permissions:
  contents: write
jobs:
  build-ubuntu:
    runs-on: ubuntu-26.04
    container:
      image: 'nvidia/cuda:13.3.1-devel-ubuntu26.04'
    strategy:
      fail-fast: true
      matrix:
        build_type:
          - Release
    env:
      DEBIAN_FRONTEND: noninteractive
      VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
      VCPKG_DEFAULT_BINARY_CACHE: /github/home/.cache/vcpkg/archives
      CC: gcc-14
      CXX: g++-14
      VCPKG_BUILD_TYPE: release
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      CUDA_HOME: /usr/local/cuda
      CUDAToolkit_ROOT: /usr/local/cuda
      CUDAToolkit_LIBRARY_ROOT: /usr/local/cuda
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates gpg wget curl git unzip tar pkg-config \
            cmake gcc-14 g++-14 ccache ninja-build \
            zip python3 python3-dev python3-venv libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev \
            libwayland-dev wayland-protocols libvulkan-dev libxkbcommon-dev libegl-dev libdecor-0-dev libibus-1.0-dev libdbus-1-dev \
            libsystemd-dev libgtk-3-dev \
            nasm autoconf autoconf-archive automake libtool \
            file desktop-file-utils

          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
                              --slave /usr/bin/g++ g++ /usr/bin/g++-14
      - name: Configure environment variables
        run: |
          echo "/usr/bin" >> $GITHUB_PATH
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "CMAKE_MAKE_PROGRAM=/usr/bin/ninja" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Get Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
      - name: Free disk space
        run: |
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android /opt/az
          rm -rf /usr/local/cuda/nsight* /usr/local/cuda/compute-sanitizer
          rm -rf /usr/local/cuda/extras /usr/local/cuda/tools
          rm -rf /usr/local/cuda/doc
          find /usr/local/cuda/targets/x86_64-linux/lib -name '*.a' \
            ! -name 'libcudart_static.a' \
            ! -name 'libcudadevrt.a' \
            ! -name 'libnvjpeg_static.a' \
            ! -name 'libnvjpeg2k_static.a' \
            ! -name 'libculibos.a' \
            -delete 2>/dev/null || true
          df -h
      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: '${{ env.VCPKG_ROOT }}'
          key: 'vcpkg-tool-${{ runner.os }}-2026-02-21'
          restore-keys: 'vcpkg-tool-${{ runner.os }}-'
      - name: Setup vcpkg
        run: |
          if [ ! -f "${{ env.VCPKG_ROOT }}/vcpkg" ]; then
            echo "vcpkg binary missing, bootstrapping..."
            if [ ! -d "${{ env.VCPKG_ROOT }}" ]; then
              git clone https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
            fi
            ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh
          fi
      - name: Configure vcpkg triplet
        run: |
          cat >> ${{ env.VCPKG_ROOT }}/triplets/x64-linux.cmake << 'EOF'
          set(VCPKG_BUILD_TYPE release)
          set(VCPKG_MAX_CONCURRENCY 2)
          set(VCPKG_C_FLAGS "-march=x86-64-v3 -mtune=generic")
          set(VCPKG_CXX_FLAGS "-march=x86-64-v3 -mtune=generic")
          list(APPEND VCPKG_CONFIGURE_MAKE_OPTIONS "--disable-avx512")
          EOF
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: >-
            ccache-${{ runner.os }}-${{ matrix.build_type }}-v2-${{ github.run_id
            }}
          restore-keys: 'ccache-${{ runner.os }}-${{ matrix.build_type }}-v2-'
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/vcpkg/archives
          key: >-
            vcpkg-pkgs-${{ runner.os }}-linux-gui-prebuilt-ort-v2-${{
            hashFiles('vcpkg.json', 'vcpkg-configuration.json',
            '.github/overlays/**') }}
          restore-keys: 'vcpkg-pkgs-${{ runner.os }}-linux-gui-prebuilt-ort-v2-'

      - name: Ensure vcpkg cache directory exists
        run: mkdir -p /github/home/.cache/vcpkg/archives
          
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_CUDA_ARCHITECTURES="86;89;90" \
            -DCUDAToolkit_ROOT=/usr/local/cuda \
            -DCUDAToolkit_LIBRARY_ROOT=/usr/local/cuda \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DBUILD_FORMAT_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PYTHON_STUBS=OFF \
            -DBUILD_PORTABLE=ON \
            -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF \
            -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF \
            -DLFS_ENABLE_CUDA_DEVICE_DEBUG=OFF \
            -DCMAKE_C_FLAGS="-pipe -march=x86-64-v3 -mtune=generic" \
            -DCMAKE_CXX_FLAGS="-pipe -march=x86-64-v3 -mtune=generic" \
            -DCMAKE_CUDA_FLAGS="-Xcompiler -march=x86-64-v3,-mtune=generic"
      - name: Clean vcpkg buildtrees
        run: |
          rm -rf build/vcpkg_installed/vcpkg/blds build/vcpkg_installed/vcpkg/pkgs
          rm -rf "${{ env.VCPKG_ROOT }}"/buildtrees "${{ env.VCPKG_ROOT }}"/downloads "${{ env.VCPKG_ROOT }}"/packages
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Prepare install payload
        run: |
          DESTDIR=dist cmake --install build
          # Bundle the vcpkg Python standard library
          mkdir -p dist/usr/lib
          cp -r build/vcpkg_installed/x64-linux/lib/python3.* dist/usr/lib/
      - name: Package Raw Artifact Tarball
        run: |
          # Package the raw bin/libs before linuxdeploy pulls in system dependencies
          cd dist
          tar -czvf ../LichtFeld-Studio-Ubuntu26.04-CUDA13.tar.gz usr/
          cd ..
      - name: Build AppImage
        shell: bash
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1

          # Find every directory in the workspace that contains a .so file
          # and add them all to the LD_LIBRARY_PATH separated by colons.
          export LD_LIBRARY_PATH=$(find . -name "*.so*" -printf '%h\n' | sort -u | tr '\n' ':')$LD_LIBRARY_PATH
          
          echo "Using LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          

          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Ensure target lib directory exists
          mkdir -p dist/usr/lib

          # Copy internal libraries from multiarch directory to dist/usr/lib/ so linuxdeploy detects them
          if [ -d "dist/usr/lib/x86_64-linux-gnu" ]; then
            cp -rn dist/usr/lib/x86_64-linux-gnu/* dist/usr/lib/ 2>/dev/null || true
          fi

          # Set LD_LIBRARY_PATH so linuxdeploy scans internal project libraries
          export LD_LIBRARY_PATH="$PWD/dist/usr/lib/x86_64-linux-gnu:$PWD/dist/usr/lib:$LD_LIBRARY_PATH"

          cat > dist/usr/bin/LichtFeld-Studio.sh <<'EOF'
          #!/bin/bash
          # SPDX-FileCopyrightText: 2025 LichtFeld Studio Authors
          # SPDX-License-Identifier: GPL-3.0-or-later
          
          # Resolve symlinks to get the true physical directory (usr/bin)
          REAL_PATH="$(readlink -f "${BASH_SOURCE[0]}")"
          SCRIPT_DIR="$( cd "$( dirname "$REAL_PATH" )" && pwd )"
          
          export LD_LIBRARY_PATH="$SCRIPT_DIR/../lib:$LD_LIBRARY_PATH"
          
          # Force embedded Python to load from the bundled standard library
          export PYTHONHOME="$SCRIPT_DIR/.."
          export PYTHONPATH="$SCRIPT_DIR/../lib/python3.12"
          
          exec "$SCRIPT_DIR/LichtFeld-Studio" "$@"
          EOF
          chmod +x dist/usr/bin/LichtFeld-Studio.sh

          EXE_PATH="dist/usr/bin/LichtFeld-Studio"
          EXE_NAME="LichtFeld-Studio"

          # Use existing Desktop file, or create a temporary one if none was installed
          DESKTOP_FILE=$(find dist -name "*.desktop" | head -n 1)
          if [ -z "$DESKTOP_FILE" ]; then
            DESKTOP_FILE="dist/${EXE_NAME}.desktop"
            cat > "$DESKTOP_FILE" <<EOF
          [Desktop Entry]
          Type=Application
          Name=LichtFeld Studio
          Exec=LichtFeld-Studio.sh
          Icon=$EXE_NAME
          Categories=Graphics;
          EOF
          fi

          # Use existing icon, or create a temporary SVG if none was installed
          ICON_FILE=$(find dist -name "${EXE_NAME}.png" -o -name "${EXE_NAME}.svg" | head -n 1)
          if [ -z "$ICON_FILE" ]; then
            ICON_FILE="dist/${EXE_NAME}.svg"
            cat > "$ICON_FILE" <<EOF
          <svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
            <rect width="256" height="256" fill="#333333"/>
            <text x="128" y="140" font-family="Arial" font-size="48" text-anchor="middle" fill="#ffffff">LFS</text>
          </svg>
          EOF
          fi

          # Collect exclusion rules for all CUDA library files and stubs
          CUDA_EXCLUDES=()
          for lib in /usr/local/cuda/lib64/*.so* /usr/local/cuda/lib64/stubs/*.so*; do
            [ -e "$lib" ] || continue
            CUDA_EXCLUDES+=("--exclude-library" "$(basename "$lib")")
          done

          # Add explicit SONAME exclusions for common CUDA runtime and driver libraries
          EXTRA_EXCLUDES=(
            # 1. Compiler Base
            "libstdc++.so.6" "libstdc++.so"
            "libgcc_s.so.1" "libgcc_s.so"
            "libgomp.so.1" "libgomp.so"
            
            # 2. Fonts
            "libfontconfig.so.1" "libfontconfig.so"
            
            # 3. Graphics & Display Server
            "libvulkan.so.1" "libvulkan.so" "libvulkan.so.1.4.341"
            "libGL.so.1" "libGL.so"
            "libEGL.so.1" "libEGL.so"
            "libGLX.so.0" "libGLX.so"
            "libdrm.so.2" "libdrm.so"
            "libgbm.so.1" "libgbm.so"
            "libwayland-client.so.0" "libwayland-server.so.0"
            "libwayland-cursor.so.0" "libwayland-cursor.so"
            "libwayland-egl.so.1" "libwayland-egl.so"
            "libxkbcommon.so.0" "libxkbcommon.so"
            
            # CUDA libraries
            "libcuda.so.1" "libcuda.so"
            "libcudart.so.13" "libcudart.so.12" "libcudart.so"
            "libcublas.so.13" "libcublas.so.12" "libcublas.so"
            "libcublasLt.so.13" "libcublasLt.so.12" "libcublasLt.so"
            "libcufft.so.11" "libcufft.so.10" "libcufft.so"
            "libcurand.so.10" "libcurand.so"
            "libcusparse.so.12" "libcusparse.so"
            "libcusolver.so.11" "libcusolver.so"
            "libnvrtc.so.13" "libnvrtc.so.12" "libnvrtc.so"
            "libnvidia-ptxjitwarper.so.1" "libnvidia-ml.so.1"
          )
          for elib in "${EXTRA_EXCLUDES[@]}"; do
            CUDA_EXCLUDES+=("--exclude-library" "$elib")
          done

          echo "Purging host-bound libraries from AppDir..."
          find dist -name "libvulkan.so*" -delete
          find dist -name "libGL.so*" -delete
          find dist -name "libEGL.so*" -delete
          find dist -name "libGLX.so*" -delete
          find dist -name "libwayland-*.so*" -delete
          find dist -name "libxkbcommon.so*" -delete
          find dist -name "libdrm.so*" -delete
          find dist -name "libgbm.so*" -delete
          find dist -name "libfontconfig.so*" -delete

          # Build AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir dist \
            --executable "$EXE_PATH" \
            --desktop-file "$DESKTOP_FILE" \
            --icon-file "$ICON_FILE" \
            "${CUDA_EXCLUDES[@]}" \
            --output appimage

          # Rename output
          mv LichtFeld*Studio*.AppImage LichtFeld-Studio-Ubuntu26.04-CUDA13.AppImage
      - name: Upload Build Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: LichtFeld-Studio-Ubuntu2604-CUDA13.4
          path: dist/usr/
          retention-days: 14
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'build-${{ github.run_id }}'
          name: 'LichtFeld Studio Build ${{ inputs.upstream_sha }}'
          files: |
            LichtFeld-Studio-Ubuntu26.04-CUDA13.AppImage
            LichtFeld-Studio-Ubuntu26.04-CUDA13.tar.gz
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
