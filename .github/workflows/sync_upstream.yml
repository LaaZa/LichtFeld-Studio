name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Merge Upstream (Ignoring Upstream Workflows)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/MrNeRF/LichtFeld-Studio.git
          git fetch upstream
          
          # 1. Merge upstream without committing immediately
          git checkout master
          git merge upstream/master --no-commit --no-ff || true
          
          # 2. Restore your local .github/workflows directory from HEAD
          git checkout HEAD -- .github/workflows
          
          # 3. Commit the merge result
          git commit -m "Merge upstream/master while preserving fork workflows" || echo "No changes to commit"
          
          # 4. Push using standard GITHUB_TOKEN (no special PAT needed)
          git push origin master
